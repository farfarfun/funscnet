[project]
name = "funscnet"
version = "1.0.7"
description = "国家超算互联网（scnet.cn）开放平台 API 的 Python 封装，覆盖令牌认证、作业提交与查询、集群信息、容器与文件管理"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.33.0",
    "farlog>=1.1.8",
]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funscnet"
Releases = "https://github.com/farfarfun/funscnet/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funscnet"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.0",
]

[tool.ruff.lint]
# farlog 使用 `{}` 占位符做参数化日志，ruff 按 stdlib logging 的 `%s` 语法
# 误判为“参数过多”，这里关闭该误报规则（参见 farfarfun/todo-list#695）。
ignore = ["PLE1205"]
